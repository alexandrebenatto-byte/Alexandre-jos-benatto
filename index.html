<!DOCTYPE html>
<html lang="pt-br">

<head>

        }
        article{
        display: flex;
        }

        img {
            width: 80px;
            height: 80px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Meu blog sobre o 1° Ano</h1>
        <p>Vou compartilhar conhecimentos sobre meus alunos</p>
    </header>
    <main>
        <article>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRaUzRUMbL7LJTFggX-moScI9OYry_INUaIMhHL46q27By8LV3oIQESzSA&s=10;
                alt="img turma">
            <div>
                <h2>DOCE OU SALGADO</h2>
                <p class="artigo-autor">Por: Alexandre benatto</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar perguntas.</p>
                <button>❤️ <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>
        <article>
            <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwliaW1tcmFBd5naOwRd3kL2cbopow_I_E_LEJ9QvfaoEJSUG_7rz-fFo&s=10
            alt="img turma">
            <div>
                <h2>MESSI OU CRITIANO RONALDO</h2>
                <p class="artigo-autor">Por: Alexandre benatto</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar perguntas.</p>
                <button>❤️ <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            if (curtiu === false){
                texto.textContent++;
                curtiu = true;
            } else{
                texto.textContent--;
                curtiu = false;
            }
        }
    })


</script>

</html>
